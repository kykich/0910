# nginx: публикация веб-чата на публичном порту (80 + HTTPS 443).
# См. docs/vps-llm-service.md §8.1.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rtk
#   sudo ln -s /etc/nginx/sites-available/rtk /etc/nginx/sites-enabled/rtk
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (самоподписанный сертификат, т.к. домена нет — доступ по IP):
#   Создать сертификат с SAN = публичный IP (см. deploy/setup-https.sh):
#     sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#       -keyout /etc/ssl/rtk/rtk.key -out /etc/ssl/rtk/rtk.crt \
#       -subj "/CN=91.188.213.252" \
#       -addext "subjectAltName=IP:91.188.213.252"
#   Браузер один раз покажет предупреждение (самоподписанный сертификат) —
#   это ожидаемо; трафик после принятия шифруется (TLS).
#
# Публичный порт задаётся здесь (listen). App слушает 127.0.0.1:8000.

# Общий набор прокси-настроек для app (используется и в 80, и в 443).
# (Определяем через include-подобный дубль: nginx не поддерживает
#  параметризацию location, поэтому блоки продублированы.)

# --- HTTP (80): редирект на HTTPS ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health-эндпоинт оставляем доступным по HTTP БЕЗ редиректа: удобно для
    # внешнего мониторинга и проверок, не требует доверия к сертификату.
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (443): основной сервис ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Самоподписанный сертификат (домена нет, доступ по IP 91.188.213.252).
    ssl_certificate     /etc/ssl/rtk/rtk.crt;
    ssl_certificate_key /etc/ssl/rtk/rtk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Размер тела запроса: вопрос + история + настройки (см. §7.3).
    client_max_body_size 1m;

    # Долгие ответы медленной CPU-модели (см. §5.6, §8.3).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Прокидываем реальный IP клиента (для rate limit, см. §7.4).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стриминг ответа (SSE) без буферизации (см. §8.3).
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    # Доступ к внутренним портам движка/app извне закрыт (см. §9).
    location /internal/ { return 404; }
}

