# nginx: публикация веб-чата на публичном порту (по умолчанию 80).
# См. docs/vps-llm-service.md §8.1.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rtk
#   sudo ln -s /etc/nginx/sites-available/rtk /etc/nginx/sites-enabled/rtk
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Публичный порт задаётся здесь (listen). App слушает 127.0.0.1:8000.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Размер тела запроса: вопрос + история + настройки (см. §7.3).
    client_max_body_size 1m;

    # Долгие ответы медленной CPU-модели (см. §5.6, §8.3).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Прокидываем реальный IP клиента (для rate limit, см. §7.4).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стриминг ответа (SSE) без буферизации (см. §8.3).
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    # Доступ к внутренним портам движка/app извне закрыт (см. §9).
    location /internal/ { return 404; }
}
